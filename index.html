<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Atmos Personalni trener — klijenti, termini i treninzi</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1512">
<meta name="description" content="Aplikacija za personalne trenere: klijenti, zakazivanje termina, podsetnici preko SMS-a, Vibera i WhatsApp-a, evidencija treninga, merenja i napredak, paketi. Sinhronizacija na Google Drive.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atmos Trener">
<style>
:root{--acc:#f0782f;--bg:#0c1512;--bg2:#111e1a;--card:#16251f;--card2:#1d3029;--line:rgba(255,255,255,.1);--txt:#eef7f3;--muted:#98b3a8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--p:#60a5fa;--c:#fbbf24;--f:#f472b6;--r:16px;--nav:64px}
:root[data-theme=light]{--bg:#f4f6f3;--bg2:#e9eee9;--card:#fff;--card2:#f1f4f0;--line:rgba(10,50,35,.12);--txt:#14231c;--muted:#5b6f66;--ok:#059669;--warn:#b45309;--bad:#dc2626;--p:#2563eb;--c:#d97706;--f:#db2777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-size:.9rem}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn-d{background:rgba(248,113,113,.15);color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn-s{padding:6px 10px;font-size:.8rem;border-radius:10px}
.btn-g{background:none;border-color:transparent;color:var(--muted)}
.fld{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:1rem}
.fld:focus{outline:2px solid var(--acc);outline-offset:-1px}
select.fld option{color:#000}
label.l{display:block;font-size:.72rem;color:var(--muted);margin:0 0 4px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top-in{max-width:900px;margin:auto;display:flex;gap:8px;align-items:center}
.logo{font-weight:800;letter-spacing:.5px;font-size:1rem;white-space:nowrap;flex:1}.logo b{color:var(--acc)}
.logo img{width:26px;height:26px;border-radius:7px;vertical-align:middle;margin-right:6px}
.shell{max-width:900px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:.8rem}.xs{font-size:.72rem}.b{font-weight:700}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat small{color:var(--muted);font-size:.7rem;display:block}.stat b{font-size:1.05rem;display:block;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:20px 10px;font-size:.9rem}
.pnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.pnav .lbl{flex:1;text-align:center;font-weight:700;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.pnav button{min-width:46px}
.bar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:6px}
.fi{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;cursor:pointer}
.fi .n{font-weight:600;font-size:.92rem;word-break:break-word}
.fi .k{font-weight:700;white-space:nowrap;text-align:right;font-size:.9rem}
.sec{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:14px 2px 6px}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:.68rem;font-weight:700;background:var(--card2);color:var(--muted);vertical-align:middle}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:.83rem}.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:7px 11px;font-size:.82rem;border-radius:999px}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{max-width:900px;margin:auto;display:flex;height:var(--nav)}
nav.bot button{flex:1;border:0;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;color:var(--muted);padding:4px}
nav.bot button span{font-size:1.3rem}
nav.bot button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:10px}
.fab button{width:56px;height:56px;border-radius:50%;font-size:1.5rem;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.35)}.fab button.pill{width:auto;border-radius:28px;padding:0 18px;font-size:1rem;font-weight:600;background:var(--card);border:1px solid var(--acc)}
dialog{border:0;padding:0;background:var(--bg);color:var(--txt);width:100%;max-width:640px;max-height:100%;height:100%;margin:auto}
@media(min-width:700px){dialog{height:auto;max-height:92vh;border-radius:18px;border:1px solid var(--line)}}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.dh h2{flex:1;margin:0;font-size:1.02rem}
.db{padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.big{font-size:2rem;font-weight:800}
.chart{display:flex;gap:4px;align-items:flex-end;height:150px;position:relative;margin-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .col i{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--acc);display:block;min-height:2px}
.chart .col i.over{background:var(--bad)}.chart .col i.no{background:var(--card2)}
.chart .col small{font-size:.58rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.chart .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--ok);opacity:.7;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.warnb{background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:10px;font-size:.85rem;margin-bottom:10px}
.okb{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);border-radius:12px;padding:10px;font-size:.85rem;margin-bottom:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid transparent}.sw button.on{border-color:var(--txt)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px 0}
.coffee-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}.coffee-ov.open{display:flex}
.coffee-box{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;max-width:380px;width:100%;max-height:92vh;overflow:auto;padding:22px;text-align:center;font-size:.92rem;line-height:1.5;position:relative}
.coffee-box h3{margin:0 0 10px;font-size:1.1rem;display:block}.coffee-box p{margin:8px 0}
.coffee-acc{display:inline-block;margin:6px 0;padding:6px 12px;border-radius:10px;background:var(--card2);font-variant-numeric:tabular-nums;letter-spacing:.5px;user-select:all}
.coffee-qr{width:200px;height:200px;margin:12px auto 4px;background:#fff;border-radius:10px;padding:6px}
.coffee-x{position:absolute;top:6px;right:10px;width:auto;background:none;border:0;color:var(--txt);font-size:1.6rem;cursor:pointer;line-height:1;padding:4px 8px}
.coffee-amts{display:flex;gap:6px;justify-content:center;margin-top:12px}.coffee-amts button{width:auto;padding:6px 12px;border-radius:10px;border:1px solid rgba(128,128,128,.45);background:rgba(128,128,128,.15);color:inherit;font:inherit;font-size:.85em;cursor:pointer}.coffee-amts button.on{background:var(--acc);border-color:var(--acc);color:#fff}.coffee-qrv svg{width:100%;height:100%;display:block}.coffee-qrv[hidden]{display:none}
.coffee-mini{display:inline-block;width:auto;margin-top:8px;padding:5px 12px;font-size:.75rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}.clk{cursor:pointer}.clk:active{opacity:.85}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:10px 10px 76px}
a{color:var(--acc)}

.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.82rem;flex:none;letter-spacing:.3px}
.srow{display:flex;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer}
.card .srow:first-of-type,.card h3+.srow{border-top:0}
.srow .tm{width:46px;text-align:center;flex:none}.srow .tm b{display:block;font-size:.95rem}.srow .tm small{color:var(--muted);font-size:.68rem}
.srow .n{font-weight:600;font-size:.92rem;word-break:break-word}
.srow.st-otk{opacity:.55}.srow.st-otk .n{text-decoration:line-through}
.srow .qa{display:flex;gap:4px}
.hello{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px}
.al{display:flex;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}.al:first-of-type{border-top:0}.al>span{font-size:1.1rem}
.dayc.today{border-color:var(--acc)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:calc(55px + env(safe-area-inset-top));background:var(--bg);z-index:2}
.tabs button{flex:none;border:0;background:var(--card2);border-radius:999px;padding:7px 13px;font-size:.84rem}.tabs button.on{background:var(--acc);color:#fff;font-weight:600}
.cact{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.cact>*{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:1.2rem;text-decoration:none;color:var(--txt)}
.cact span{font-size:.7rem;color:var(--muted)}
.mbtn{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.mbtn button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.72rem}.mbtn span{font-size:1.15rem}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.mcal b{font-size:.68rem;color:var(--muted)}
.mcal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.78rem;background:var(--card2)}
.mcal span:empty{background:none}.mcal .td{outline:2px solid var(--acc)}
.mcal .d-odr{background:var(--ok);color:#06281c;font-weight:700;cursor:pointer}.mcal .d-ndo{background:var(--bad);color:#fff;cursor:pointer}.mcal .d-otk{background:var(--muted);color:var(--bg);cursor:pointer}.mcal .d-zak{border:2px solid var(--p);cursor:pointer}
.lc{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:.72rem;padding:4px 2px;border-bottom:1px solid var(--line)}.tbl td{padding:7px 2px;border-bottom:1px solid var(--line)}.tbl tr[data-act]{cursor:pointer}
.exb{background:var(--card2);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.sets{display:grid;gap:4px;margin-top:6px}.set{display:grid;grid-template-columns:22px 1fr 14px 1fr 34px;gap:6px;align-items:center}.set .fld{padding:7px 8px;font-size:.92rem;text-align:center}
.chips button.btn-p{color:#fff}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo"><img src="icon-192.png" alt="">Atmos <b>Trener</b></div>
  <span id="gdst" class="small muted"></span>
</div></header>
<main class="shell" id="app"></main>
<div class="fab" id="fab"></div>
<nav class="bot"><div class="in" id="nav"></div></nav>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<div id="toast"></div>
<script>
'use strict';
const VER='1.2',KEY='atmosTrener1',APP='Atmos Personalni trener';
const ACCENTS=['#f0782f','#0f9d78','#3b82f6','#8b5cf6','#e11d48','#eab308'];
const COLLS=['clients','sessions','measures','packages','templates','exercises'];
const ST={zak:['Zakazan','📅','var(--p)'],odr:['Održan','✅','var(--ok)'],otk:['Otkazan','🚫','var(--muted)'],ndo:['Nije došao','❌','var(--bad)']};
const TYPES=['Personalni','Grupni','Online','Konsultacija','Probni'];
const MEAS=[['kg','Težina','kg'],['fat','Masno tkivo','%'],['mus','Mišićna masa','kg'],['waist','Struk','cm'],['chest','Grudi','cm'],['hips','Kukovi','cm'],['arm','Nadlaktica','cm'],['thigh','Butina','cm'],['calf','List','cm'],['neck','Vrat','cm']];
const CCOL=['#f0782f','#0f9d78','#3b82f6','#8b5cf6','#e11d48','#eab308','#14b8a6','#ec4899','#64748b','#84cc16'];
const EXLIB={
 'Grudi':['Bench press (ravna klupa)','Bench press (kosa klupa)','Bench press (negativna klupa)','Potisak bučicama','Razvlačenje bučicama','Peck-deck / leptir','Crossover na sajli','Sklekovi','Propadanja (dips)'],
 'Leđa':['Mrtvo dizanje','Zgibovi','Lat mašina (privlačenje)','Veslanje šipkom','Veslanje bučicom','Veslanje na sajli (sedeći)','T-bar veslanje','Hiperekstenzije','Pullover'],
 'Noge':['Čučanj (šipka)','Prednji čučanj','Goblet čučanj','Leg press','Iskoraci','Bugarski čučanj','Rumunsko mrtvo dizanje','Ekstenzija nogu','Pregib nogu (ležeći)','Hip thrust','Glute bridge','Abdukcija kukova','Podizanje na prste (listovi)','Step-up na klupu'],
 'Ramena':['Vojnički potisak','Potisak bučicama sedeći','Arnold potisak','Odručenje bučicama','Predručenje','Rear delt / obrnuti leptir','Face pull','Veslanje uz telo (upright row)','Slegovanje ramenima'],
 'Ruke':['Pregib šipkom (biceps)','Pregib bučicama','Hammer pregib','Scott pregib','Pregib na sajli','Francuski potisak','Ekstenzija na sajli (triceps)','Kickback bučicom','Uski bench press'],
 'Stomak i core':['Plank','Bočni plank','Trbušnjaci (crunch)','Podizanje nogu u visu','Ruski twist','Mountain climbers','Dead bug','Bird dog','Ab wheel','Pallof press'],
 'Kardio':['Traka za trčanje','Bicikl (sobni)','Eliptični trenažer','Veslački ergometar','Stepper','Preskakanje vijače','Hodanje uzbrdo'],
 'Funkcionalno':['Burpees','Kettlebell swing','Turkish get-up','Farmer walk','Sanke (sled push)','Battle rope','Box jump','Medicinka (bacanje)','Wall ball','TRX veslanje','Istezanje / mobilnost']};
const DEF_REM='Zdravo {ime}! 💪 Podsetnik za trening: {datum} u {vreme}h{mesto}. Vidimo se! {trener}';
const DEF_SUM='Zdravo {ime}! Današnji trening ({datum}):\n{trening}\nOdlično si odradio/la, samo tako! 💪 {trener}';
const DEF_NOT='Zdravo {ime}! Primetio/la sam da se dugo nismo videli na treningu. Da zakažemo termin ove nedelje? 💪 {trener}';

/* ---------- pomoćne ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};
const dayDiff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const DAYS=['ned','pon','uto','sre','čet','pet','sub'],DAYSF=['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
const MONS=['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'],MONF=['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
function dlabel(s){const t=today();if(s===t)return'Danas';if(s===addDays(t,-1))return'Juče';if(s===addDays(t,1))return'Sutra';return dshort(s)}
function dshort(s){const d=new Date(s+'T12:00:00');return DAYS[d.getDay()]+', '+d.getDate()+'. '+MONS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
function dmsg(s){const t=today();const d=new Date(s+'T12:00:00');const w=DAYSF[d.getDay()]+', '+d.getDate()+'. '+MONS[d.getMonth()];return s===t?'danas ('+w+')':s===addDays(t,1)?'sutra ('+w+')':w}
const weekStart=s=>{const d=new Date(s+'T12:00:00');const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ds(d)};
const r1=x=>{const v=Math.round((Number(x)||0)*10)/10;return String(v).replace('.',',')};
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmtN=v=>v==null?'':String(v).replace('.',',');
const money=v=>(Math.round(Number(v)||0)).toLocaleString('sr-RS')+' '+(S().cur||'RSD');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'dj');
const tmin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):0};
const mtime=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
let dDepth=0,dPend=0,dIgnore=0,dSkip=0;
function openD(d){if(d.open)return;d.showModal();dDepth++;try{history.pushState({atmosDlg:dDepth},'')}catch{}}
function onDClose(){if(dSkip){dSkip--;return}if(dDepth>0){dDepth--;dPend++;clearTimeout(onDClose.t);onDClose.t=setTimeout(()=>{const n=dPend;dPend=0;if(n){dIgnore++;history.go(-n)}},0)}}
addEventListener('popstate',()=>{if(dIgnore){dIgnore--;return}const c3=document.getElementById('dlg3'),a=document.getElementById('dlg2'),b=document.getElementById('dlg'),top=c3&&c3.open?c3:a.open?a:b.open?b:null;
  if(top){dDepth=Math.max(0,dDepth-1);dSkip++;top.close()}});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}

/* ---------- podaci ---------- */
function freshSet(){return{theme:'dark',accent:ACCENTS[0],trainer:'',gym:'',phone:'',dur:60,price:'',cur:'RSD',ndoUsed:true,remTpl:DEF_REM,sumTpl:DEF_SUM,notTpl:DEF_NOT,inactive:14}}
function fresh(){const o={v:1,settings:freshSet(),_mt:{},_lh:{}};COLLS.forEach(k=>o[k]=[]);return o}
function normDb(x){x=x&&typeof x==='object'?x:{};const o=fresh();o.settings=Object.assign(freshSet(),x.settings||{});

const avatar=(c,sz)=>`<span class="av" style="background:${c&&c.color||'var(--card2)'};${sz?`width:${sz}px;height:${sz}px;font-size:${sz*.38}px`:''}">${esc(initials(c&&c.name))}</span>`;

const nextSess=cid=>{const t=today(),n=new Date(),nm=n.getHours()*60+n.getMinutes();return sessOf(cid).filter(s=>s.status==='zak'&&(s.date>t||(s.date===t&&tmin(s.time)+(s.dur||60)>=nm))).sort(sortS)[0]};

function pkgInfo(p){const ss=sessOf(p.cid).filter(s=>s.pkg===p.id||(!s.pkg&&s.date>=p.start&&(!p.end||s.date<=p.end)&&!s.price));
  const u=ss.filter(used).length,left=p.count?Math.max(0,p.count-u):null,exp=p.end&&p.end<today();return{u,left,exp,active:!exp&&(left==null||left>0)}}
const activePkg=cid=>db.packages.filter(p=>p.cid===cid).sort((a,b)=>b.start.localeCompare(a.start)).find(p=>pkgInfo(p).active);
function age(b){if(!b)return null;const d=new Date(b+'T12:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a>0&&a<120?a:null}
function bdayIn(b){if(!b)return null;const t=today(),y=+t.slice(0,4);for(const yy of[y,y+1]){const d=yy+b.slice(4);const k=dayDiff(d,t);if(k>=0)return k}return null}
const measOf=cid=>db.measures.filter(m=>m.cid===cid).sort((a,b)=>a.date.localeCompare(b.date));
const lastMeas=(cid,k)=>{const a=measOf(cid).filter(m=>m[k]!=null);return a.length?a[a.length-1][k]:null};

/* ---------- poruke: SMS / Viber / WhatsApp ---------- */
function phoneIntl(p){let s=String(p||'').replace(/[^\d+]/g,'');if(!s)return'';if(s.startsWith('00'))s='+'+s.slice(2);else if(s.startsWith('0'))s='+381'+s.slice(1);else if(!s.startsWith('+'))s=(s.startsWith('381')?'+':'+381')+s;return s}
function fill(tpl,v){let t=String(tpl||'');for(const k in v)t=t.split('{'+k+'}').join(v[k]==null?'':v[k]);return t.replace(/[ \t]+\n/g,'\n').trim()}
function msgVars(c,s){return{ime:first(c&&c.name),datum:s?dmsg(s.date):'',vreme:s?s.time:'',trener:S().trainer||'',mesto:S().gym?(' — '+S().gym):'',trajanje:s?(s.dur||60)+' min':''}}
function workoutText(s){return(s.ex||[]).filter(e=>e.name).map(e=>'• '+e.name+(e.sets&&e.sets.length?': '+e.sets.map(x=>(x.r||'?')+(x.kg?'×'+fmtN(x.kg)+'kg':'')).join(', '):'')+(e.note?' ('+e.note+')':'')).join('\n')||'• '+(s.notes||'trening')}
async function sendMsg(ch,c,text){const ph=phoneIntl(c&&c.phone);if(!ph&&ch!=='copy'&&ch!=='share'){toast('Klijent nema upisan broj telefona');return false}
  const dig=ph.replace('+',''),t=encodeURIComponent(text);
  if(ch==='sms')location.href='sms:'+ph+(isIOS?'&':'?')+'body='+t;
  else if(ch==='wa')window.open('https://wa.me/'+dig+'?text='+t,'_blank');
  else if(ch==='viber'){try{await navigator.clipboard.writeText(text);toast('Tekst je kopiran — u Viberu ga samo nalepi')}catch{toast('Viber nema automatski tekst — prepiši poruku')}setTimeout(()=>{location.href='viber://chat?number=%2B'+dig},350)}
  else if(ch==='share'){try{await navigator.share({text});}catch(e){if(e&&e.name!=='AbortError'){try{await navigator.clipboard.writeText(text);toast('Tekst kopiran')}catch{}}}}
  else if(ch==='copy'){try{await navigator.clipboard.writeText(text);toast('Tekst kopiran ✔')}catch{toast('Kopiranje nije uspelo')}}
  return true}
const msgBtns=(act,extra)=>`<div class="mbtn">${[['sms','💬','SMS'],['viber','🟣','Viber'],['wa','🟢','WhatsApp'],['copy','📋','Kopiraj']].map(x=>`<button data-act="${act}" data-ch="${x[0]}" ${extra||''}><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`;

  o+=`<div class="card"><h3>🌙 Sutra${tz.length?` <button class="btn-s ${un.length?'btn-p':''}" data-act="bulkrem" data-d="${tm}">🔔 Podsetnici (${un.length?un.length+' za slanje':'poslato'})</button>`:''}</h3>${tms.length?tms.map(s=>sRow(s)).join(''):'<div class="empty">Sutra nema termina.</div>'}</div>`;
  /* upozorenja i ideje */
  const al=[];
  db.packages.forEach(p=>{const c=C(p.cid);if(!c||c.arch)return;const i=pkgInfo(p);if(p.archived)return;
    if(i.left===1&&!i.exp)al.push(['📦',`${esc(c.name)} — u paketu „${esc(p.name||'paket')}“ ostao je još <b>1 termin</b>`,p.cid]);
    else if(i.left===0&&!p.renewed&&dayDiff(t,p.start)<120)al.push(['📦',`${esc(c.name)} — paket „${esc(p.name||'paket')}“ je potrošen`,p.cid]);
    else if(p.end&&!i.exp&&dayDiff(p.end,t)<=3&&i.left)al.push(['⏳',`${esc(c.name)} — paket ističe ${esc(dlabel(p.end).toLowerCase())}, ostalo ${i.left} termina`,p.cid]);
    if(!p.paid&&p.price&&dayDiff(t,p.start)>=0)al.push(['💰',`${esc(c.name)} — paket nije plaćen (${money(p.price)})`,p.cid])});
  const unp=db.sessions.filter(s=>s.status==='odr'&&s.price&&!s.paid);
  if(unp.length)al.push(['💰',`Neplaćeni održani termini: <b>${unp.length}</b> (${money(unp.reduce((a,s)=>a+(+s.price||0),0))})`,'']);

function rCal(){const w=ui.week,e=addDays(w,6),t=today();const d0=new Date(w+'T12:00:00'),d1=new Date(e+'T12:00:00');

  const all=db.sessions.filter(s=>s.date>=w&&s.date<=e);

  for(let i=0;i<7;i++){const d=addDays(w,i),ss=daySess(d);

function rReports(){const m=ui.rm,[y,mo]=m.split('-').map(Number),ss=db.sessions.filter(s=>s.date.slice(0,7)===m);
  const odr=ss.filter(s=>s.status==='odr'),otk=ss.filter(s=>s.status==='otk'),ndo=ss.filter(s=>s.status==='ndo');
  const incS=odr.filter(s=>s.paid).reduce((a,s)=>a+(+s.price||0),0),incP=db.packages.filter(p=>p.paid&&(p.paidDate||p.start).slice(0,7)===m).reduce((a,p)=>a+(+p.price||0),0);
  const unpaid=odr.filter(s=>s.price&&!s.paid).reduce((a,s)=>a+(+s.price||0),0);
  const nc=db.clients.filter(c=>(c.start||'').slice(0,7)===m).length,rate=odr.length+ndo.length?Math.round(odr.length/(odr.length+ndo.length)*100):null;
  let o=`<div class="pnav"><button data-act="rm" data-v="-1">‹</button><div class="lbl">${MONF[mo-1]} ${y}</div><button data-act="rm" data-v="1">›</button></div>
   <div class="grid g2" style="margin-bottom:12px"><div class="stat"><small>Održani treninzi</small><b>${odr.length}</b></div><div class="stat"><small>Prihod (plaćeno)</small><b>${money(incS+incP)}</b></div>
   <div class="stat"><small>Otkazano / nije došao</small><b>${otk.length} / ${ndo.length}</b></div><div class="stat"><small>Dolaznost</small><b>${rate==null?'—':rate+'%'}</b></div>
   <div class="stat"><small>Neplaćeno (termini)</small><b style="color:${unpaid?'var(--warn)':'inherit'}">${money(unpaid)}</b></div><div class="stat"><small>Novi klijenti</small><b>${nc}</b></div></div>`;
  const dim=new Date(y,mo,0).getDate(),per=[];let mx=1;for(let d=1;d<=dim;d++){const k=m+'-'+pad(d),n=odr.filter(s=>s.date===k).length;per.push([d,n]);mx=Math.max(mx,n)}
  o+=`<div class="card"><h3>📈 Održani treninzi po danima</h3><div class="chart">${per.map(([d,n])=>`<div class="col" title="${d}. ${MONS[mo-1]}: ${n}"><i style="height:${n?Math.max(4,n/mx*100):0}%"></i><small>${d%5===0||d===1?d:''}</small></div>`).join('')}</div></div>`;
  const byC={};odr.forEach(s=>{const b=byC[s.cid]=byC[s.cid]||{n:0,inc:0,due:0};b.n++;if(s.paid)b.inc+=+s.price||0;else b.due+=+s.price||0});

  const types={};odr.forEach(s=>types[s.type||'Personalni']=(types[s.type||'Personalni']||0)+1);
  if(Object.keys(types).length>1)o+=`<div class="card"><h3>🏷️ Po vrsti treninga</h3>${Object.entries(types).map(([k,v])=>`<div class="row sp small" style="padding:4px 0"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div>`;
  o+=`<div class="grid g2"><button data-act="csv">📑 Izvoz meseca (CSV / Excel)</button><button data-act="share-month">📤 Podeli izveštaj</button></div>`;
  return o}

let cv={id:null,tab:'pregled',metric:'kg',mon:null};
function openClient(id,tab){cv={id,tab:tab||'pregled',metric:'kg',mon:today().slice(0,7)};const d=$('#dlg');d.innerHTML=cHtml();openD(d)}
function cRedraw(){const d=$('#dlg');if(d.open&&cv.id){const st=d.querySelector('.db')?d.querySelector('.db').scrollTop:0;d.innerHTML=cHtml();const b=d.querySelector('.db');if(b)b.scrollTop=st}}
function cHtml(){const c=C(cv.id);if(!c)return`<div class="dh"><button class="btn-s" data-act="close">✕</button><h2>Klijent</h2></div><div class="db"><div class="empty">Klijent nije pronađen.</div></div>`;
  const tabs=[['pregled','Pregled'],['treninzi','Treninzi'],['napredak','Napredak'],['paketi','Paketi'],['beleske','Beleške']];
  return`<div class="dh"><button class="btn-s" data-act="close">✕</button>${avatar(c,34)}<h2>${esc(c.name)}${c.arch?' <span class="badge">arhiva</span>':''}</h2><button class="btn-s" data-act="editclient" data-v="${c.id}">✏️</button></div>
   <div class="tabs">${tabs.map(t=>`<button data-act="ctab" data-v="${t[0]}" class="${cv.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>

function cOverview(c){const ss=sessOf(c.id),odr=ss.filter(s=>s.status==='odr'),ndo=ss.filter(s=>s.status==='ndo'),n=nextSess(c.id),p=activePkg(c.id),pi=p&&pkgInfo(p);
  const m30=odr.filter(s=>dayDiff(today(),s.date)<30&&s.date<=today()).length,rate=odr.length+ndo.length?Math.round(odr.length/(odr.length+ndo.length)*100):null;
  const kg=measOf(c.id).filter(m=>m.kg!=null),k0=kg[0],k1=kg[kg.length-1];
  let o=`<div class="card"><div class="cact">${c.phone?`<a class="btn" href="tel:${esc(phoneIntl(c.phone))}">📞<span>Pozovi</span></a>`:''}<button data-act="cmsg" data-ch="sms">💬<span>SMS</span></button><button data-act="cmsg" data-ch="viber">🟣<span>Viber</span></button><button data-act="cmsg" data-ch="wa">🟢<span>WhatsApp</span></button></div>
   <div class="small muted" style="margin-top:10px;line-height:1.7">${c.phone?'📱 '+esc(c.phone)+'<br>':''}${c.email?'✉️ '+esc(c.email)+'<br>':''}${age(c.birth)!=null?'🎂 '+age(c.birth)+' god.'+(c.sex?' · '+(c.sex==='m'?'muško':'žensko'):'')+'<br>':''}${c.height?'📏 '+esc(c.height)+' cm<br>':''}${c.goal?'🎯 '+esc(c.goal)+'<br>':''}${c.start?'🗓️ Klijent od '+esc(dshort(c.start)):''}</div>
   ${c.health?`<div class="warnb" style="margin:10px 0 0">⚕️ ${esc(c.health)}</div>`:''}</div>`;
  o+=`<div class="grid g3" style="margin-bottom:12px"><div class="stat"><small>Treninga</small><b>${odr.length}</b></div><div class="stat"><small>Zadnjih 30 dana</small><b>${m30}</b></div><div class="stat"><small>Dolaznost</small><b>${rate==null?'—':rate+'%'}</b></div>
   <div class="stat"><small>Težina</small><b>${k1?r1(k1.kg)+' kg':'—'}</b></div><div class="stat"><small>Promena</small><b>${k0&&k1&&k0!==k1?(k1.kg-k0.kg>0?'+':'')+r1(k1.kg-k0.kg)+' kg':'—'}</b></div><div class="stat"><small>BMI</small><b>${k1&&c.height?r1(k1.kg/Math.pow(c.height/100,2)):'—'}</b></div></div>`;
  o+=`<div class="card"><h3>📅 Sledeći termin <button class="btn-s" data-act="newsess" data-c="${c.id}">＋ Zakaži</button></h3>${n?sRow(n,{date:1}):'<div class="small muted">Nema zakazanih termina.</div>'}</div>`;
  o+=`<div class="card"><h3>📦 Paket</h3>${p?pkgRow(p):`<div class="small muted">Nema aktivnog paketa.</div><button class="btn-s" style="margin-top:8px" data-act="newpkg">＋ Novi paket</button>`}</div>`;
  const l=lastDone(c.id);if(l)o+=`<div class="card"><h3>🏋️ Poslednji trening · ${esc(dlabel(l.date))}</h3><div class="small" style="white-space:pre-wrap;line-height:1.5">${esc(workoutText(l))}</div></div>`;
  o+=`<button style="width:100%" data-act="shareprog">📤 Pošalji klijentu pregled napretka</button>`;
  return o}
function cSessions(c){const ss=sessOf(c.id).sort(sortS).reverse(),[y,m]=cv.mon.split('-').map(Number),dim=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7;
  const mm=ss.filter(s=>s.date.slice(0,7)===cv.mon);
  let o=`<div class="card"><div class="pnav" style="margin-bottom:8px"><button data-act="cmon" data-v="-1">‹</button><div class="lbl">${MONF[m-1]} ${y}</div><button data-act="cmon" data-v="1">›</button></div>
   <div class="mcal">${['P','U','S','Č','P','S','N'].map(x=>`<b>${x}</b>`).join('')}${'<span></span>'.repeat(off)}${Array.from({length:dim},(_,i)=>{const d=cv.mon+'-'+pad(i+1),s=mm.find(x=>x.date===d&&x.status==='odr')||mm.find(x=>x.date===d);return`<span class="${s?'d-'+s.status:''} ${d===today()?'td':''}" ${s?`data-act="opensess" data-v="${s.id}"`:''}>${i+1}</span>`}).join('')}</div>
   <div class="xs muted" style="margin-top:8px">✅ održano ${mm.filter(s=>s.status==='odr').length} · ❌ nije došao ${mm.filter(s=>s.status==='ndo').length} · 🚫 otkazano ${mm.filter(s=>s.status==='otk').length} · 📅 zakazano ${mm.filter(s=>s.status==='zak').length}</div></div>`;
  o+=`<button class="btn-p" style="width:100%;margin-bottom:12px" data-act="newsess" data-c="${c.id}">＋ Novi termin</button>`;
  const card=s=>`<div class="card" style="padding:10px 12px" data-act="opensess" data-v="${s.id}"><div class="row sp"><b class="small">${esc(dshort(s.date))} · ${esc(s.time)}</b><span class="xs" style="color:${ST[s.status][2]}">${ST[s.status][1]} ${ST[s.status][0]}</span></div>${s.status==='odr'&&((s.ex&&s.ex.length)||s.notes)?`<div class="xs muted" style="white-space:pre-wrap;margin-top:4px">${esc(workoutText(s))}</div>`:''}</div>`;
  const up=ss.filter(s=>s.status==='zak'&&s.date>=today()).reverse(),hist=ss.filter(s=>!(s.status==='zak'&&s.date>=today()));
  if(!ss.length)o+='<div class="empty">Još nema termina.</div>';
  if(up.length)o+=`<div class="sec">📅 Zakazano (${up.length})</div>`+up.slice(0,10).map(card).join('')+(up.length>10?`<div class="xs muted" style="margin:-4px 2px 10px">… i još ${up.length-10}</div>`:'');
  if(hist.length)o+=`<div class="sec">🕘 Istorija (${hist.length})</div>`+hist.map(card).join('');
  return o}
function lineChart(pts,unit){if(pts.length<2)return'<div class="xs muted" style="padding:6px 0">Za grafikon su potrebna bar dva merenja.</div>';
  const W=320,H=140,P=24,xs=pts.map(p=>new Date(p.d+'T12:00:00').getTime()),vs=pts.map(p=>p.v),x0=Math.min(...xs),x1=Math.max(...xs),v0=Math.min(...vs),v1=Math.max(...vs),rv=(v1-v0)||1;
  const X=t=>P+(x1===x0?0:(t-x0)/(x1-x0))*(W-2*P),Y=v=>H-P-((v-v0)/rv)*(H-2*P);
  const path=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" class="lc"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/><path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="var(--acc)"><title>${dshort(p.d)}: ${fmtN(p.v)} ${unit}</title></circle>`).join('')}
   <text x="${P}" y="14" font-size="10" fill="var(--muted)">${fmtN(v1)} ${unit}</text><text x="${P}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtN(v0)} ${unit}</text><text x="${W-P}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${dshort(pts[pts.length-1].d)}</text></svg>`}
function cProgress(c){const ms=measOf(c.id),mk=MEAS.find(x=>x[0]===cv.metric)||MEAS[0];
  const pts=ms.filter(m=>m[mk[0]]!=null).map(m=>({d:m.date,v:m[mk[0]]}));
  let o=`<button class="btn-p" style="width:100%;margin-bottom:12px" data-act="newmeas">📏 Novo merenje</button>`;
  o+=`<div class="card"><h3>📈 ${mk[1]}</h3><div class="chips" style="margin-bottom:8px">${MEAS.filter(x=>ms.some(m=>m[x[0]]!=null)||x[0]==='kg').map(x=>`<button data-act="metric" data-v="${x[0]}" class="${cv.metric===x[0]?'btn-p':''}">${x[1]}</button>`).join('')}</div>${lineChart(pts,mk[2])}
   ${pts.length>=2?`<div class="small" style="margin-top:6px">Od ${esc(dshort(pts[0].d))}: <b>${(pts[pts.length-1].v-pts[0].v>0?'+':'')+r1(pts[pts.length-1].v-pts[0].v)} ${mk[2]}</b></div>`:''}</div>`;
  if(ms.length){const f=ms[0],l=ms[ms.length-1];
    o+=`<div class="card"><h3>📏 Mere — prvo i poslednje merenje</h3><table class="tbl"><tr><th></th><th>${esc(dshort(f.date))}</th><th>${esc(dshort(l.date))}</th><th>Razlika</th></tr>${MEAS.filter(x=>f[x[0]]!=null||l[x[0]]!=null).map(x=>`<tr><td>${x[1]}</td><td>${f[x[0]]!=null?fmtN(f[x[0]]):'—'}</td><td>${l[x[0]]!=null?fmtN(l[x[0]]):'—'}</td><td>${f[x[0]]!=null&&l[x[0]]!=null&&ms.length>1?`<b>${(l[x[0]]-f[x[0]]>0?'+':'')+r1(l[x[0]]-f[x[0]])}</b> ${x[2]}`:''}</td></tr>`).join('')}</table></div>`;
    o+=`<div class="card"><h3>🗓️ Sva merenja (${ms.length})</h3>${[...ms].reverse().map(m=>`<div class="srow" data-act="editmeas" data-v="${m.id}"><div class="grow"><div class="n small">${esc(dshort(m.date))}</div><div class="xs muted">${MEAS.filter(x=>m[x[0]]!=null).map(x=>x[1]+' '+fmtN(m[x[0]])+' '+x[2]).join(' · ')}${m.note?' · '+esc(m.note):''}</div></div><span class="muted">›</span></div>`).join('')}</div>`}
  const pr={};sessOf(c.id).filter(s=>s.status==='odr').forEach(s=>(s.ex||[]).forEach(e=>(e.sets||[]).forEach(x=>{const k=num(x.kg);if(k&&(!pr[e.name]||k>pr[e.name].kg))pr[e.name]={kg:k,r:x.r,d:s.date}})));
  const pk=Object.entries(pr).sort((a,b)=>b[1].kg-a[1].kg);
  if(pk.length)o+=`<div class="card"><h3>🏆 Lični rekordi (najveća kilaža)</h3>${pk.slice(0,20).map(([n,v])=>`<div class="row sp small" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><span><b>${fmtN(v.kg)} kg</b>${v.r?' × '+esc(v.r):''} <span class="muted xs">${esc(dshort(v.d))}</span></span></div>`).join('')}</div>`;
  return o}
function pkgRow(p){const i=pkgInfo(p);return`<div class="srow" data-act="editpkg" data-v="${p.id}"><div class="grow"><div class="n">${esc(p.name||'Paket')}${i.exp?' <span class="badge">istekao</span>':i.left===0?' <span class="badge">potrošen</span>':''}</div>
   <div class="xs muted">${p.count?'Iskorišćeno '+i.u+'/'+p.count+' · ostalo <b style="color:var(--txt)">'+i.left+'</b>':'Neograničeno · iskorišćeno '+i.u}${p.end?' · važi do '+esc(dshort(p.end)):''}${p.price?' · '+money(p.price)+(p.paid?' ✔ plaćeno':' · <span style="color:var(--warn)">nije plaćeno</span>'):''}</div>
   ${p.count?`<div class="bar"><i style="width:${Math.min(100,i.u/p.count*100)}%;background:${i.left<=1?'var(--warn)':'var(--acc)'}"></i></div>`:''}</div><span class="muted">›</span></div>`}
function cPackages(c){const ps=db.packages.filter(p=>p.cid===c.id).sort((a,b)=>b.start.localeCompare(a.start));

  o+=`<div class="card"><h3>💰 Neplaćeni pojedinačni treninzi</h3>${unp.length?unp.sort(sortS).map(s=>`<div class="row sp small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(dshort(s.date))} · ${esc(s.time)}</span><span><b>${money(s.price)}</b> <button class="btn-s" data-act="paysess" data-v="${s.id}">✔ Plaćeno</button></span></div>`).join('')+`<div class="row sp" style="margin-top:8px"><b>Ukupno</b><b style="color:var(--warn)">${money(unp.reduce((a,s)=>a+(+s.price||0),0))}</b></div><button style="width:100%;margin-top:8px" data-act="payall">✔ Označi sve kao plaćeno</button>`:'<div class="small muted">Sve je plaćeno ✔</div>'}</div>`;

function cNotes(c){return`<div class="card"><label class="l">🎯 Cilj</label><input class="fld" data-cn="goal" value="${esc(c.goal||'')}" placeholder="npr. -8 kg do leta, snaga, rehabilitacija kolena">

    gdClient.callback=r=>{if(r&&r.access_token){gdTok={t:r.access_token,exp:Date.now()+(Number(r.expires_in)||3600)*1000};try{sessionStorage.setItem(GD_KEY+'_t',JSON.stringify(gdTok))}catch{}res()}else rej(new Error((r&&r.error)||'Dozvola nije data'))};
    gdClient.error_callback=e=>rej(new Error(e&&e.type==='popup_closed'?'Prozor za prijavu je zatvoren':'Prijava na Google nije uspela'));
    gdClient.requestAccessToken({prompt:consent?'consent':'',hint:gd.email||undefined})})}
async function gdApi(url,opt){const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+gdTok.t},(opt&&opt.headers)||{})}));
  if(r.status===401){gdTok=null;try{sessionStorage.removeItem(GD_KEY+'_t')}catch{}throw new Error('auth')}
  if(!r.ok)throw new Error('Drive greška '+r.status);return r}
async function gdFindFile(){
  if(gd.fileId){try{const j=await (await gdApi('https://www.googleapis.com/drive/v3/files/'+gd.fileId+'?fields=id,trashed')).json();if(!j.trashed)return gd.fileId}catch(e){if(e.message==='auth')throw e}gd.fileId=''}
  const q=encodeURIComponent("name='"+GD_NAME.replace(/'/g,"\\'")+"' and trashed=false");
  const j=await (await gdApi('https://www.googleapis.com/drive/v3/files?spaces=drive&orderBy=modifiedTime desc&fields=files(id)&q='+q)).json();
  gd.fileId=(j.files&&j.files[0]&&j.files[0].id)||'';return gd.fileId}
async function gdUpload(body){const txt=JSON.stringify(body);
  if(gd.fileId){await gdApi('https://www.googleapis.com/upload/drive/v3/files/'+gd.fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:txt});return}
  const b='atmostrener'+Date.now(),meta={name:GD_NAME,mimeType:'application/json',description:'Podaci aplikacije Atmos Personalni trener. Ne menjaj ručno.'};
  const r=await gdApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
    body:'--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+txt+'\r\n--'+b+'--'});
  gd.fileId=(await r.json()).id}
function gdSoon(ms){if(!gd.on||!GD_CLIENT)return;clearTimeout(gdT);gdT=setTimeout(()=>{if(gdValid())gdSync()},ms==null?5000:ms)}
async function gdSync(manual){
  if(!GD_CLIENT||!gd.on||gdBusy)return;
  if(!navigator.onLine){gd.err='Nema interneta — izmene čekaju';gdStore();if(manual)toast(gd.err);return}
  if(document.querySelector('dialog[open]')&&!manual){gdSoon(20000);return}
  gdBusy=true;if(manual)render();let redraw=!!manual,retry=false;
  try{
    if(!gdValid()){if(!manual){gd.err='Potrebna je potvrda — dodirni „Sinhronizuj“';gdStore();return}await gdAuth(false)}
    const ver=async()=>gd.fileId?Number((await (await gdApi('https://www.googleapis.com/drive/v3/files/'+gd.fileId+'?fields=version')).json()).version)||0:0;
    let remote={recs:{}},v0=0;
    if(await gdFindFile()){v0=await ver();try{remote=await (await gdApi('https://www.googleapis.com/drive/v3/files/'+gd.fileId+'?alt=media')).json()}catch(e){if(e.message==='auth')throw e;remote={recs:{}}}}
    const R=remote.recs||{},loc=gdLocal(),now=Date.now(),out=Object.assign({},R);let got=0,sent=0;
    const mine={};Object.keys(loc).forEach(k=>{const h=gdHash(loc[k]);if(gd.h[k]!==h||!(k in R))mine[k]=loc[k]});
    Object.keys(gd.h).forEach(k=>{if(!(k in loc))mine[k]=null});
    /* profil/podešavanja: ako su promenjeni i ovde i na drugom uređaju — novija izmena pobeđuje; uređaj koji se prvi put povezuje preuzima sa Drive-a */
    ['_set'].forEach(k=>{if(!(k in mine)||!(k in R)||!R[k]||R[k].d==null)return;const rh=gdHash(R[k].d);if(rh===gd.h[k])return;
      if(gd.h[k]===undefined||(R[k].m||0)>=(db._mt[k]||0))delete mine[k]});
    Object.keys(R).forEach(k=>{
      const rv=R[k]&&R[k].d!==undefined?R[k].d:null,rh=rv?gdHash(rv):null;
      if(k in mine)return;if(rh===(gd.h[k]||null))return;
      if(k==='_set'){if(rv){gd.h[k]=gdHash(gdApplySingle(k,rv));got++}return}
      const[c,id]=k.split('/');if(!GD_COLLS.includes(c))return;
      const i=db[c].findIndex(x=>x.id===id);
      if(rv){if(i>=0)db[c][i]=rv;else db[c].push(rv);gd.h[k]=rh}else{if(i>=0)db[c].splice(i,1);delete gd.h[k]}
      got++});
    Object.keys(mine).forEach(k=>{out[k]={t:now,d:mine[k]};if(k[0]==='_')out[k].m=db._mt[k]||now;sent++;if(mine[k])gd.h[k]=gdHash(mine[k]);else delete gd.h[k]});
    if(gd.fileId&&sent&&(await ver())!==v0){if((gdSync.retry=(gdSync.retry||0)+1)<=3){retry=true;gdBusy=false;setTimeout(()=>gdSync(manual),300+Math.random()*700);return}}
    gdSync.retry=0;
    if(sent||!gd.fileId)await gdUpload({app:APP,v:1,t:new Date().toISOString(),recs:out});
    if(got){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}
    gd.last=Date.now();gd.err='';gdStore();
    if(manual)toast(got?'Sinhronizovano ✔ — stiglo izmena: '+got:'Sinhronizovano ✔');
    if(got)redraw=true;
  }catch(e){gd.err=e.message==='auth'?'Potrebna je potvrda — dodirni „Sinhronizuj“':String(e.message||'Greška');gdStore();if(manual)toast('⚠ '+gd.err)}
  finally{if(!retry){gdBusy=false;gdRender(redraw)}}}
function gdRender(full){const a=document.activeElement;if(document.querySelector('dialog[open]')||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){clearTimeout(gdWait);gdWait=setTimeout(()=>gdRender(full),1500);return}if(full||ui.tab==='podesavanja')render();else $('#gdst').textContent=gd.on?(gd.err?'☁️ ⚠':'☁️'):''}
async function gdConnect(){
  try{await gdAuth(true);
    try{const u=await (await gdApi('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json();gd.email=(u.user&&u.user.emailAddress)||''}catch{}
    gd.on=true;gd.h={};gd.fileId='';
    gdStore();toast('Google Drive povezan ✔');await gdSync(true)}
  catch(e){toast('⚠ '+(e.message||'Povezivanje nije uspelo'))}}
function gdDisconnect(){
  if(!confirm('Prekinuti sinhronizaciju sa Google Drive-om? Podaci ostaju i na uređaju i na Drive-u.'))return;

  gdTok=null;try{sessionStorage.removeItem(GD_KEY+'_t')}catch{}
  gd={on:false,fileId:'',h:{},last:0,err:'',email:''};gdStore();render();toast('Veza sa Google Drive-om je prekinuta')}
function gdCard(){
  if(!gd.on)return`<div class="card"><h3>☁️ Google Drive</h3><div class="small muted" style="margin-bottom:10px">Čuvaj klijente i termine na svom Google Drive-u i koristi ih na više uređaja (telefon, tablet, računar). Ako ti se pokvari ili izgubi telefon, ništa ne gubiš. Aplikacija vidi samo svoj fajl „${esc(GD_NAME)}“, ništa drugo sa tvog Drive-a.</div>
    <button class="btn-p" data-act="gdconnect" style="width:100%">☁️ Poveži Google Drive</button></div>`;

    <div class="small muted">${gd.email?esc(gd.email)+'<br>':''}${t?'Poslednja sinhronizacija: '+dlabel(ds(t))+' u '+pad(t.getHours())+':'+pad(t.getMinutes()):'Još nije sinhronizovano'}</div>
